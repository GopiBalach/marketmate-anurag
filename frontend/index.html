<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>MarketMate - Digital Grocery Store</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-50 text-gray-900">

    <!-- =========================
         HEADER
    ========================== -->

    <header class="bg-green-600 text-white shadow-md">

        <div class="max-w-7xl mx-auto px-6 py-4
                    flex items-center justify-between">

            <!-- Logo -->
            <a href="/"
               class="text-2xl font-bold tracking-wide">
                MarketMate
            </a>

            <!-- Navigation -->
            <nav class="flex items-center gap-6">

                <a href="/?page=login"
                   class="text-sm font-medium
                          hover:text-green-100
                          transition">
                    Login
                </a>

                <a href="/?page=register"
                   class="bg-white text-green-600
                          px-5 py-2 rounded-lg
                          text-sm font-semibold
                          hover:bg-green-50
                          transition shadow-sm">
                    Register
                </a>

            </nav>

        </div>

    </header>


    <!-- =========================
         HERO SECTION
    ========================== -->

    <main class="min-h-[calc(100vh-130px)]
                 flex items-center">

        <div class="max-w-7xl mx-auto
                    px-6 py-16
                    w-full">

            <div class="max-w-3xl mx-auto
                        text-center">

                <!-- Badge -->
                <span class="inline-block
                             bg-green-100
                             text-green-700
                             px-4 py-2
                             rounded-full
                             text-sm
                             font-semibold
                             mb-6">

                    🛒 Welcome to MarketMate

                </span>


                <!-- Heading -->
                <h1 class="text-5xl md:text-6xl
                           font-bold
                           leading-tight
                           mb-6">

                    Your Digital

                    <span class="text-green-600">
                        Grocery Store
                    </span>

                </h1>


                <!-- Description -->
                <p class="text-lg
                          md:text-xl
                          text-gray-600
                          leading-relaxed
                          mb-10">

                    Shop groceries easily, manage your
                    cart, and track your orders with
                    MarketMate.

                </p>


                <!-- Buttons -->
                <div class="flex flex-col
                            sm:flex-row
                            justify-center
                            gap-4">

                    <a href="/?page=register"
                       class="bg-green-600
                              text-white
                              px-7 py-3
                              rounded-lg
                              font-semibold
                              hover:bg-green-700
                              transition
                              shadow-lg">

                        Get Started

                    </a>


                    <a href="/?page=login"
                       class="border border-green-600
                              text-green-600
                              px-7 py-3
                              rounded-lg
                              font-semibold
                              hover:bg-green-600
                              hover:text-white
                              transition">

                        Login

                    </a>

                </div>

            </div>

        </div>

    </main>

    <template id="loginPage">
        <div class="w-full max-w-md rounded-2xl border border-gray-100 bg-white p-8 shadow-xl">
            <div class="mb-8 text-center">
                <div class="mx-auto mb-4 flex h-14 w-14 items-center justify-center rounded-full bg-green-100 text-2xl text-green-600">🔐</div>
                <h1 class="text-3xl font-bold text-gray-900">Welcome Back</h1>
                <p class="mt-2 text-gray-500">Login to your MarketMate account</p>
            </div>
            <form id="loginForm" class="space-y-5">
                <div>
                    <label for="loginEmail" class="mb-2 block text-sm font-semibold text-gray-700">Email</label>
                    <input type="email" id="loginEmail" placeholder="Enter your email" required class="w-full rounded-lg border border-gray-300 px-4 py-3 outline-none transition focus:border-green-500 focus:ring-2 focus:ring-green-500">
                </div>
                <div>
                    <label for="loginPassword" class="mb-2 block text-sm font-semibold text-gray-700">Password</label>
                    <input type="password" id="loginPassword" placeholder="Enter your password" required class="w-full rounded-lg border border-gray-300 px-4 py-3 outline-none transition focus:border-green-500 focus:ring-2 focus:ring-green-500">
                </div>
                <button type="submit" class="w-full rounded-lg bg-green-600 py-3 font-semibold text-white shadow-md transition hover:bg-green-700">Login</button>
                <p id="loginMessage" class="min-h-5 text-center text-sm text-gray-600" aria-live="polite"></p>
            </form>
            <p class="mt-6 text-center text-sm text-gray-600">Don't have an account? <a href="/?page=register" class="font-semibold text-green-600 hover:text-green-700">Create Account</a></p>
        </div>
    </template>

    <template id="registerPage">
        <div class="w-full max-w-md rounded-2xl border border-gray-100 bg-white p-8 shadow-xl">
            <div class="mb-8 text-center">
                <div class="mx-auto mb-4 flex h-14 w-14 items-center justify-center rounded-full bg-green-100 text-2xl text-green-600">🛒</div>
                <h1 class="text-3xl font-bold text-gray-900">Create Account</h1>
                <p class="mt-2 text-gray-500">Join MarketMate today</p>
                <p class="mt-2 text-xs text-gray-500">Demo only: accounts are stored in this browser and do not connect to the live database.</p>
            </div>
            <form id="registerForm" class="space-y-5">
                <div>
                    <label for="name" class="mb-2 block text-sm font-semibold text-gray-700">Name</label>
                    <input type="text" id="name" placeholder="Enter your name" required class="w-full rounded-lg border border-gray-300 px-4 py-3 outline-none transition focus:border-green-500 focus:ring-2 focus:ring-green-500">
                </div>
                <div>
                    <label for="email" class="mb-2 block text-sm font-semibold text-gray-700">Email</label>
                    <input type="email" id="email" placeholder="Enter your email" required class="w-full rounded-lg border border-gray-300 px-4 py-3 outline-none transition focus:border-green-500 focus:ring-2 focus:ring-green-500">
                </div>
                <div>
                    <label for="password" class="mb-2 block text-sm font-semibold text-gray-700">Password</label>
                    <input type="password" id="password" placeholder="Enter your password" required class="w-full rounded-lg border border-gray-300 px-4 py-3 outline-none transition focus:border-green-500 focus:ring-2 focus:ring-green-500">
                </div>
                <div>
                    <label for="confirmPassword" class="mb-2 block text-sm font-semibold text-gray-700">Confirm Password</label>
                    <input type="password" id="confirmPassword" placeholder="Confirm your password" required class="w-full rounded-lg border border-gray-300 px-4 py-3 outline-none transition focus:border-green-500 focus:ring-2 focus:ring-green-500">
                </div>
                <button type="submit" class="w-full rounded-lg bg-green-600 py-3 font-semibold text-white shadow-md transition hover:bg-green-700">Create Account</button>
                <p id="registerMessage" class="min-h-5 text-center text-sm text-gray-600" aria-live="polite"></p>
            </form>
            <p class="mt-6 text-center text-sm text-gray-600">Already have an account? <a href="/?page=login" class="font-semibold text-green-600 hover:text-green-700">Login</a></p>
        </div>
    </template>

    <template id="dashboardPage">
        <div class="mb-10">
            <p class="mb-2 font-semibold text-green-600">MarketMate Dashboard</p>
            <h1 class="mb-3 text-4xl font-bold md:text-5xl">
                Welcome, <span id="userName" class="text-green-600">User</span> 👋
            </h1>
            <p class="text-lg text-gray-500">What would you like to do today?</p>
        </div>

        <div class="grid grid-cols-1 gap-6 md:grid-cols-2 lg:grid-cols-3">
            <section class="rounded-2xl border border-gray-100 bg-white p-7 shadow-sm">
                <div class="mb-5 flex h-14 w-14 items-center justify-center rounded-xl bg-green-100 text-3xl text-green-600">🛒</div>
                <h2 class="mb-2 text-xl font-bold">Products</h2>
                <p class="leading-relaxed text-gray-500">Browse MarketMate grocery products.</p>
            </section>
            <section class="rounded-2xl border border-gray-100 bg-white p-7 shadow-sm">
                <div class="mb-5 flex h-14 w-14 items-center justify-center rounded-xl bg-blue-100 text-3xl text-blue-600">🛍️</div>
                <h2 class="mb-2 text-xl font-bold">Cart</h2>
                <p class="leading-relaxed text-gray-500">Your shopping session is ready.</p>
            </section>
            <section class="rounded-2xl border border-gray-100 bg-white p-7 shadow-sm">
                <div class="mb-5 flex h-14 w-14 items-center justify-center rounded-xl bg-purple-100 text-3xl text-purple-600">📦</div>
                <h2 class="mb-2 text-xl font-bold">Orders</h2>
                <p class="leading-relaxed text-gray-500">Your orders will appear here.</p>
            </section>
        </div>

        <div class="mt-10 rounded-2xl border border-green-100 bg-green-50 p-6">
            <h2 class="text-lg font-bold text-green-800">Welcome to MarketMate</h2>
            <p class="mt-1 text-sm text-green-700">You are signed in and can use the demo dashboard.</p>
        </div>
    </template>

    <script src="js/script.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/navigation.js"></script>

    <!-- =========================
         FOOTER
    ========================== -->

    <footer class="border-t bg-white">

        <div class="max-w-7xl mx-auto
                    px-6 py-5
                    text-center
                    text-sm text-gray-500">

            © 2026 MarketMate.
            All rights reserved.

        </div>

    </footer>

</body>

</html>
