<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>MarketMate - Digital Grocery Store</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-50 text-gray-900">

    <!-- =========================
         HEADER
    ========================== -->

    <header class="bg-green-600 text-white shadow-md">

        <div class="max-w-7xl mx-auto px-6 py-4
                    flex items-center justify-between">

            <!-- Logo -->
            <a href="/index.html"
               class="text-2xl font-bold tracking-wide">
                MarketMate
            </a>

            <!-- Navigation -->
            <nav class="flex items-center gap-6">

                <a href="/login/"
                   class="text-sm font-medium
                          hover:text-green-100
                          transition">
                    Login
                </a>

                <a href="/register/"
                   class="bg-white text-green-600
                          px-5 py-2 rounded-lg
                          text-sm font-semibold
                          hover:bg-green-50
                          transition shadow-sm">
                    Register
                </a>

            </nav>

        </div>

    </header>


    <!-- =========================
         HERO SECTION
    ========================== -->

    <main class="min-h-[calc(100vh-130px)]
                 flex items-center">

        <div class="max-w-7xl mx-auto
                    px-6 py-16
                    w-full">

            <div class="max-w-3xl mx-auto
                        text-center">

                <!-- Badge -->
                <span class="inline-block
                             bg-green-100
                             text-green-700
                             px-4 py-2
                             rounded-full
                             text-sm
                             font-semibold
                             mb-6">

                    🛒 Welcome to MarketMate

                </span>


                <!-- Heading -->
                <h1 class="text-5xl md:text-6xl
                           font-bold
                           leading-tight
                           mb-6">

                    Your Digital

                    <span class="text-green-600">
                        Grocery Store
                    </span>

                </h1>


                <!-- Description -->
                <p class="text-lg
                          md:text-xl
                          text-gray-600
                          leading-relaxed
                          mb-10">

                    Shop groceries easily, manage your
                    cart, and track your orders with
                    MarketMate.

                </p>


                <!-- Buttons -->
                <div class="flex flex-col
                            sm:flex-row
                            justify-center
                            gap-4">

                    <a href="/register/"
                       class="bg-green-600
                              text-white
                              px-7 py-3
                              rounded-lg
                              font-semibold
                              hover:bg-green-700
                              transition
                              shadow-lg">

                        Get Started

                    </a>


                    <a href="/login/"
                       class="border border-green-600
                              text-green-600
                              px-7 py-3
                              rounded-lg
                              font-semibold
                              hover:bg-green-600
                              hover:text-white
                              transition">

                        Login

                    </a>

                </div>

            </div>

        </div>

    </main>


    <!-- =========================
         FOOTER
    ========================== -->

    <footer class="border-t bg-white">

        <div class="max-w-7xl mx-auto
                    px-6 py-5
                    text-center
                    text-sm text-gray-500">

            © 2026 MarketMate.
            All rights reserved.

        </div>

    </footer>

</body>

</html>
