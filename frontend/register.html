<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Create Account - MarketMate</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

</head>


<body class="bg-gray-50 text-gray-900">


    <!-- =========================
         HEADER
    ========================== -->

    <header class="bg-green-600 text-white shadow-md">

        <div class="max-w-7xl mx-auto
                    px-6 py-4
                    flex items-center
                    justify-between">

            <!-- Logo -->
            <a href="/"
               class="text-2xl font-bold
                      tracking-wide">

                MarketMate

            </a>


            <!-- Navigation -->
            <nav class="flex items-center gap-6">

                <a href="/"
                   class="text-sm font-medium
                          hover:text-green-100
                          transition">

                    Home

                </a>


                <a href="/?page=login"
                   class="text-sm font-medium
                          hover:text-green-100
                          transition">

                    Login

                </a>

            </nav>

        </div>

    </header>


    <!-- =========================
         REGISTER SECTION
    ========================== -->

    <main class="min-h-[calc(100vh-70px)]
                 flex items-center
                 justify-center
                 px-6 py-12">


        <!-- Register Card -->

        <div class="w-full max-w-md
                    bg-white
                    rounded-2xl
                    shadow-xl
                    border border-gray-100
                    p-8">


            <!-- Heading -->

            <div class="text-center mb-8">

                <div class="w-14 h-14
                            mx-auto mb-4
                            bg-green-100
                            text-green-600
                            rounded-full
                            flex items-center
                            justify-center
                            text-2xl">

                    🛒

                </div>


                <h1 class="text-3xl
                           font-bold
                           text-gray-900">

                    Create Account

                </h1>


                <p class="text-gray-500
                          mt-2">

                    Join MarketMate today

                </p>
                <p class="mt-2 text-xs text-gray-500">Demo only: accounts are stored in this browser and do not connect to the live database.</p>

            </div>


            <!-- Register Form -->

            <form id="registerForm"
                  class="space-y-5">


                <!-- Name -->

                <div>

                    <label for="name"
                           class="block
                                  text-sm
                                  font-semibold
                                  text-gray-700
                                  mb-2">

                        Name

                    </label>


                    <input
                        type="text"
                        id="name"
                        placeholder="Enter your name"
                        required

                        class="w-full
                               px-4 py-3
                               border border-gray-300
                               rounded-lg
                               outline-none
                               focus:ring-2
                               focus:ring-green-500
                               focus:border-green-500
                               transition">

                </div>


                <!-- Email -->

                <div>

                    <label for="email"
                           class="block
                                  text-sm
                                  font-semibold
                                  text-gray-700
                                  mb-2">

                        Email

                    </label>


                    <input
                        type="email"
                        id="email"
                        placeholder="Enter your email"
                        required

                        class="w-full
                               px-4 py-3
                               border border-gray-300
                               rounded-lg
                               outline-none
                               focus:ring-2
                               focus:ring-green-500
                               focus:border-green-500
                               transition">

                </div>


                <!-- Password -->

                <div>

                    <label for="password"
                           class="block
                                  text-sm
                                  font-semibold
                                  text-gray-700
                                  mb-2">

                        Password

                    </label>


                    <input
                        type="password"
                        id="password"
                        placeholder="Enter your password"
                        required

                        class="w-full
                               px-4 py-3
                               border border-gray-300
                               rounded-lg
                               outline-none
                               focus:ring-2
                               focus:ring-green-500
                               focus:border-green-500
                               transition">

                </div>


                <!-- Confirm Password -->

                <div>

                    <label for="confirmPassword"
                           class="block
                                  text-sm
                                  font-semibold
                                  text-gray-700
                                  mb-2">

                        Confirm Password

                    </label>


                    <input
                        type="password"
                        id="confirmPassword"
                        placeholder="Confirm your password"
                        required

                        class="w-full
                               px-4 py-3
                               border border-gray-300
                               rounded-lg
                               outline-none
                               focus:ring-2
                               focus:ring-green-500
                               focus:border-green-500
                               transition">

                </div>


                <!-- Register Button -->

                <button
                    type="submit"

                    class="w-full
                           bg-green-600
                           text-white
                           py-3
                           rounded-lg
                           font-semibold
                           hover:bg-green-700
                           active:bg-green-800
                           transition
                           shadow-md">

                    Create Account

                </button>


                <!-- Message -->

                <p id="registerMessage"
                   class="text-center
                          text-sm
                          min-h-[20px]">
                </p>

            </form>


            <!-- Login Link -->

            <div class="text-center
                        mt-6
                        text-sm
                        text-gray-600">

                Already have an account?

                <a href="/?page=login"
                   class="text-green-600
                          font-semibold
                          hover:text-green-700">

                    Login

                </a>

            </div>

        </div>

    </main>


    <!-- Existing JavaScript -->

    <script src="js/auth.js"></script>
    <script src="js/script.js"></script>

</body>

</html>
